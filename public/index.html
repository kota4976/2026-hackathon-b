<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>アプリ名</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Zen+Kurenaido&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components/list.css">
    <link rel="stylesheet" href="css/components/message.css">
</head>
<body>

    <div id="registration-screen" class="screen full-center">
        <div class="glass-card">
            <h1>アプリ名</h1>
            <p class="subtitle">みんなで愚痴を書き殴る、共有ノートです。</p>
            <form id="userForm" autocomplete="off">
                <div class="form-group">
                    <input type="text" id="username" required placeholder="なまえ（適当でいいよ）" autocomplete="off">
                </div>
                <button type="submit" class="primary-btn">ノートを開く</button>
            </form>
        </div>
    </div>

    <div id="main-app-screen" class="screen main-layout hidden">
        <header class="app-header">
            <div class="logo">アプリ名</div>
            <div class="user-profile">
                <span id="current-username">ユーザー名</span>
                <button id="logout-btn" class="text-btn">ノートを閉じる</button>
            </div>
        </header>

        <div id="pane-container" class="three-pane-container">
            
            <aside class="pane category-pane">
                <h2>もくじ</h2>
                <ul id="category-list" class="nav-list">
                </ul>
            </aside>

            <div class="resizer" id="resizer-1"></div>

            <main class="pane thread-pane">
                <div class="pane-header">
                    <h2 id="current-category-title">いまのボヤキ</h2>
                    <button id="open-create-thread-btn" class="icon-btn" title="新しく書き込む">✎</button>
                </div>
                <div id="thread-list" class="content-list">
                        <!-- JSで動的に追加される -->
                </div>
            </main>

            <!-- ドラッグ用境界線 -->
            <div class="resizer" id="resizer-2"></div>

            <section class="pane detail-pane">
                <div id="thread-detail-container" class="hidden">
                    <div class="pane-header">
                        <h2 id="detail-thread-title">誰かのページ</h2>
                        <span id="detail-thread-author" class="meta-info">投稿者</span>
                    </div>
                    <div id="reply-list" class="messages-area">
                            <!-- JSで動的に追加される -->
                    </div>
                    <div class="reply-input-area">
                        <form id="replyForm" autocomplete="off">
                            <input type="text" id="reply-content" required placeholder="わかる / それな / 大変だったね..." autocomplete="off">
                            <button type="submit" class="send-btn">書き込む</button>
                        </form>
                    </div>
                </div>
                <!-- 未選択時の表示 -->
                <div id="empty-state-detail" class="empty-state pane-center">
                    <p>ノートをめくってみよう</p>
                </div>
            </section>
        </div>
    </div>

    <!-- スレッド作成モーダル -->
    <div id="create-thread-modal" class="modal-overlay hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h3>新しくページを作る</h3>
                <button id="close-modal-btn" class="icon-btn close-btn">×</button>
            </div>
            <form id="createThreadForm" autocomplete="off">
                <div class="form-group">
                    <label for="thread-title">タイトル</label>
                    <input type="text" id="thread-title" required placeholder="（例）今日の満員電車がさぁ...">
                </div>
                <div class="form-group">
                    <label for="thread-category">カテゴリ</label>
                    <select id="thread-category" required>
                            <!-- JSで動的に追加される -->
                    </select>
                </div>
                <div class="modal-actions">
                    <button type="button" id="cancel-thread-btn" class="text-btn">キャンセル</button>
                    <button type="submit" class="primary-btn">書きなぐる</button>
                </div>
            </form>
        </div>
    </div>

    <script type="module" src="js/main.js"></script>
</body>
</html>
