<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple User Creation</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>ユーザー作成</h1>
        <form id="userForm">
            <div class="form-group">
                <label for="username">名前</label>
                <input type="text" id="username" required placeholder="名前を入力">
            </div>
            <button type="submit">作成</button>
        </form>
    </div>
    <script src="register.js"></script>
</body>
</html>
